<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Flipkart Label Cropper</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: white;
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ddd;
    }
    h1 { color: #174ea6; }
    input, button {
      margin: 12px;
      padding: 12px;
      font-size: 16px;
    }
    button {
      background: #174ea6;
      color: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Flipkart Label Cropper</h1>
    <p>Free Shipping Label Tool</p>
    <p>Upload your shipping label PDF to get started.</p>
    <input type="file" accept=".pdf" id="pdfFile">
    <br>
    <button onclick="alert('PDF cropping feature will be added next!')">
      Crop Label
    </button>
    <p>Free tool for online sellers</p>
  </div>
</body>
</html>
